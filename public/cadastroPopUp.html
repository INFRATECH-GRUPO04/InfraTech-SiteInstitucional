<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - InfraTech</title>
    <link rel="stylesheet" href="css/cadastro_pop.css">
</head>
<body>
    <div class="div_popup">
        <h1 class="titulo_popup">INFRA<span class="corzinha">TECH</span></h1>
        <p class="titulo_popup texto_popup">CADASTRAR</p>
        <div class="ipt_separado">
            <input type="text" id="ipt_nome" class="campoTexto" placeholder="João Silva">
            <input type="text" id="ipt-codigo" class="campoTexto" placeholder="A44FSF">
        </div>
        <input type="text" id="ipt_cpf" class="campoTexto" placeholder="000.003.444-41">
        <input type="text" id="ipt_email_corporativo" class="campoTexto" placeholder="voce@empresa.com">
        <input type="text" id="ipt_senha" class="campoTexto" placeholder="Mínimo 8 caracteres">
        <input type="text" id="ipt_confirmar_senha" class="campoTexto" placeholder="Repita a senha">

        <div class="div_btn_criarConta">
            <button id="btn_cadastro" class="btn_cadastro">CRIAR CONTA</button>
            <p class="texto">Já tem conta?  <a href="login.html" class="texto_dif"> Entrar</a></p>
        </div>
    </div>
</body>
</html>
