<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - InfraTech</title>
    <link rel="stylesheet" href="css/cadastro_pop.css">
</head>
<body>
    <div class="div_popup">
        <h1 class="titulo_popup">INFRA<span class="corzinha">TECH</span></h1>
        <p class="titulo_popup texto_popup">CADASTRAR</p>
        <div class="ipt_separado">
            <input type="text" id="ipt_nome" class="campoTexto">
            <input type="text" id="ipt-codigo" class="campoTexto">
        </div>
        <input type="text" id="ipt_cpf" class="campoTexto">
        <input type="text" id="ipt_email_corporativo" class="campoTexto">
        <input type="text" id="ipt_senha" class="campoTexto" placeholder="Mínimo 8 caracteres">
        <input type="text" id="ipt_confirmar_senha" class="campoTexto">

        <button id="btn_cadastro" class="btn_cadastro"></button>
    </div>
</body>
</html>
