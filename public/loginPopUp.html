<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InfraTech</title>
    <link rel="stylesheet" href="css/cadastro_pop.css">
</head>

<body>
    <div class="div_popup">
        <div class="div_canto_superior">
            <div class="borda_esquerda"></div>
            <div class="borda_direita">
                <button onclick="fechar()">x</button>
            </div>
        </div>
        <div class="div_titulo">
            <div>
                <img src="assets/icon/CadastroIcon.png" alt="Logo da InfraTech" class="img-icon">
                <h1 class="titulo_popup">INFRA<span class="corzinha">TECH</span></h1>
            </div>
            <p class="titulo_popup texto_popup">ENTRAR</p>
        </div>
        <div class="div_componentes_login">
            <div class="campo_login espaco">
                <p>E-MAIL</p>
                <input type="text" id="ipt_email_corporativo" class="campoTexto" placeholder="voce@empresa.com">
            </div>
            <div class="campo_login">
                <p>SENHA</p>
                <input type="text" id="ipt_senha" class="campoTexto" placeholder="Mínimo 8 caracteres">
                <div class="senha">
                    <input type="checkbox" name="lembrar">
                    <label for="lembrar">Lembrar Acesso</label>
                    <span>Esqueci a senha</span>
                </div>
            </div>
        </div>

        <div class="div_btn_entrarSistema">
            <button id="btn_login" class="btn_login">ENTRAR NO SISTEMA</button>
            <div class="divisoria">OU</div>
            <button id="btn_redirecionar" class="btn_redirecionar">CRIAR NOVA CONTA</button>
        </div>
        <div class="div_canto_inferior">
            <div class="borda_esquerda"></div>
            <div class="borda_direita"></div>
        </div>
    </div>
</body>

</html>
