<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="../css/global.css?v=2">
      <link rel="stylesheet" href="../css/cadastro-base.css?v=2">
      <link rel="stylesheet" href="../css/cadastro_servidor.css?v=2">
      <link rel="stylesheet" href="../css/barralateral.css?v=2">
      <title>Cadastrar Servidor | InfraTech</title>

          
    <script src="../js/sessao.js"></script>
</head>
<body>

<div class="header-left">
    <div class="logo">
        <img src="../assets/icon/logo.png" alt="Logo">
    </div>

    <hr class="linha">

    <!-- Seção Servidores -->
    <h3 class="nav-categoria">
        <img src="../assets/imgs/servidores.png" alt="" class="menu-icon-title">
        Servidores
    </h3>
    <hr class="linha">

    <a href="../dentro.html" class="nav-item">
        <img src="../assets/imgs/dashboards.png" alt="" class="menu-icon">
        Dashboard
    </a>
    <a href="../dashboard/modificar_servidor.html" class="nav-item">
        <img src="../assets/imgs/modificar.png" alt="" class="menu-icon">
        Modificar
    </a>
    <a href="./cadastro_servidor.html" class="nav-item ativo">
        <img src="../assets/imgs/modificar.png" alt="" class="menu-icon">
        Cadastrar
    </a>

    <!-- Seção Funcionários -->
    <h3 class="nav-categoria secao-funcionarios">
        <img src="../assets/imgs/funcionarios.png" alt="" class="menu-icon-title">
        Funcionários
    </h3>
    <hr class="linha">

    <a href="./cadastro_token.html" class="nav-item">
        <img src="../assets/imgs/token.png" alt="" class="menu-icon">
        Cadastrar Token
    </a>
    <a href="../dashboard/modificar_funcionario.html" class="nav-item">
        <img src="../assets/imgs/modificar.png" alt="" class="menu-icon">
        Modificar
    </a>

    <!-- Botão Sair -->
    <div class="btn-logout" onclick="limparSessao()" title="Sair">
        <img src="../assets/imgs/logout.png" alt="" class="logout-icon">
    </div>
</div>

    <div class="conteudo-principal">
        <div class="titulo-pagina">
            <span class="destaque">|</span> CADASTRAR SERVIDOR
        </div>

        <div class="painel-formulario">
            <div class="cabecalho-painel">
                <img src="../assets/icon/logo_server.png" alt="">
                <div>
                    <h3>Cadastrar Infraestrutura</h3>
                    <p>Provisione novos servidores físicos ou instâncias virtuais</p>
                </div>
            </div>

 

            <div class="grupo-formulario">
                <label>NOME DO SERVIDOR</label>
                <input type="text" class="controle-formulario" placeholder="SRV-DATABASE-PRIMARY" id="nome_servidor_id">
            </div>

            <div class="titulo-secao">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                ALOCAÇÃO DE RECURSOS (COMPONENTES)
            </div>

            <!-- Container for dynamic components -->
            <div id="alinhar" style="display: flex; flex-direction: column; gap: 20px;"></div>

            <div>
                <button type="button" class="botao-contorno-tracejado" onclick="adicionarComponente()">+ Adicionar Componente</button>
            </div>

            <button type="button" class="botao-primario" onclick="cadastrarServidorCompleto()">Adicionar Servidor</button>
        </div>
    </div>
</body>
</html>
<script>
    let contador = 0;
    let inputsLista = [];

    // Inicia com CPU e RAM como no design
    window.onload = function() {
        adicionarComponente("cpu");
        adicionarComponente("ram");
    };

    function adicionarComponente(tipoInit = "cpu") {
        const divPai = document.getElementById("alinhar");
        const div = document.createElement("div");
        div.id = `a${contador}`;
        div.className = "caixa-alocacao";
        inputsLista.push(div.id);

        let isCpu = tipoInit === "cpu";

        div.innerHTML = `
            <div class="linha-alocacao">
                <div class="rotulo-alocacao">
                    <select class="controle-formulario" style="width: 100%; border: none; background-color: transparent; padding: 0; font-weight: bold; color: white;" id="input${contador}" onchange="trocarComplemento(this, 'b${contador}')">
                        <option value="cpu" ${tipoInit === 'cpu' ? 'selected' : ''}>CPU</option>
                        <option value="ram" ${tipoInit === 'ram' ? 'selected' : ''}>Memória RAM</option>
                        <option value="disco" ${tipoInit === 'disco' ? 'selected' : ''}>Disco SSD</option>
                    </select>
                </div>
                <div class="container-barra-progresso">
                    <div class="barra-progresso"></div>
                </div>
                <div class="entradas-alocacao">
                    <div class="grupo-entrada-alocacao">
                        <input type="number" class="controle-formulario" id="input-capacidade${contador}" value="${isCpu ? 8 : 32}" min="1">
                        <span id="b${contador}">${isCpu ? 'Cores' : 'GB'}</span>
                    </div>
                    <button class="botao-excluir" onclick="removerComponente('a${contador}')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>
            </div>
            <div class="sub-linha-alocacao">
                <span>0% alocado</span>
                <div class="grupo-limite-alerta">
                    <label>Atenção:</label>
                    <div class="grupo-entrada-alocacao">
                        <input type="number" class="controle-formulario" id="input-atencao${contador}" value="${isCpu ? 75 : 80}" min="1" max="100" style="width: 70px;">
                        <span>%</span>
                    </div>
                    <label style="margin-left: 15px;">Crítico:</label>
                    <div class="grupo-entrada-alocacao">
                        <input type="number" class="controle-formulario" id="input-critico${contador}" value="${isCpu ? 90 : 95}" min="1" max="100" style="width: 70px;">
                        <span>%</span>
                    </div>
                </div>
            </div>
        `;
        
        divPai.append(div);
        contador++;
    }

    function removerComponente(id) {
        document.getElementById(id).remove();
        inputsLista = inputsLista.filter(item => item !== id);
    }
    
    function trocarComplemento(selectElement, spanId) {
        let span = document.getElementById(spanId);
        if(selectElement.value == "cpu") {
            span.innerHTML = "Cores";
        } else if (selectElement.value == "ram" || selectElement.value == "disco") {
            span.innerHTML = "GB";   
        }
    }

    function cadastrarServidorCompleto() {
        var nomeServidor = document.getElementById("nome_servidor_id").value.trim();
        
        if (nomeServidor.length == 0 || nomeServidor.length > 45) {
            alert("O nome do servidor deve ter entre 1 e 45 caracteres!");
            return;
        }

        if (inputsLista.length == 0) {
            alert("Adicione pelo menos um componente!");
            return;
        }

        // 1. Cadastra o Servidor
        fetch("/servidor/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeServer: nomeServidor,
                idEmpresaServer: sessionStorage.ID_EMPRESA || 1 // fallback
            })
        })
        .then(function (resposta) {
            if (!resposta.ok) {
                throw new Error("Houve um erro ao cadastrar o servidor!");
            }
            return resposta.json();
        })
        .then(function (dados) {
            let idServidorCadastrado = dados.idServidor;
            console.log("Servidor cadastrado com sucesso! ID:", idServidorCadastrado);

            // 2. Cadastra os Componentes vinculados ao servidor
            let promises = inputsLista.map(id => {
                let indice = id.substring(1);
                let componente = document.getElementById(`input${indice}`).value;
                let capacidade = Number(document.getElementById(`input-capacidade${indice}`).value);
                let limiteAtencao = Number(document.getElementById(`input-atencao${indice}`).value);
                let limiteCritico = Number(document.getElementById(`input-critico${indice}`).value);
                let valorComponente = 0;

                if (componente == "cpu") valorComponente = 1;
                else if (componente == "ram") valorComponente = 2;
                else if (componente == "disco") valorComponente = 3;

                return fetch("/servidor/cadastrar/componente", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        fkServidorServer: idServidorCadastrado,
                        fkComponenteServer: valorComponente,
                        capacidadeServer: capacidade,
                        limiteAtencaoServer: limiteAtencao,
                        limiteCriticoServer: limiteCritico
                    }),
                }).then(res => {
                    if(!res.ok) throw new Error("Erro no componente");
                });
            });

            Promise.all(promises).then(() => {
                alert("Servidor e componentes cadastrados com sucesso!");
                window.location.href = "modificar_servidor.html";
            }).catch(erro => {
                console.log("#ERRO Componentes:", erro);
                alert("Servidor cadastrado, mas houve um erro ao salvar um ou mais componentes.");
            });

        })
        .catch(function (erro) {
            console.log("#ERRO:", erro);
            alert("Erro ao cadastrar servidor.");
        });
    }
</script>
