<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar funcionário</title>
    <link rel="icon" href="../../../../assets/icon/logo.png" type="image/png">
    <link rel="stylesheet" href="../../../../compartilhado/css/global.css">
    <link rel="stylesheet" href="gerenciar_funcionario.css">
    <script src="../../../../compartilhado/js/sessao.js"></script>
</head>

<body onload="validarSessao()">
    <aside class="header-left">
        <div class="logo">
            <a href="../../../../dashboard/dash-geral.html" title="InfraTech">
                <img src="../../../../assets/icon/logo.png" alt="Logo">
            </a>
        </div>

        <hr class="linha">

        <h3 class="nav-categoria">
            <img src="../../../../assets/imgs/servidores.png" alt="" class="menu-icon-title">
            Servidores
        </h3>
        <hr class="linha">

        <!-- Adicione a classe 'ativo' no link da página correspondente -->
        <a href="../../../../dashboard/dash-geral.html" class="nav-item">
            <img src="../../../../assets/imgs/dashboards.png" alt="" class="menu-icon">
            Dashboard
        </a>
        <a href="../../servidores/cadastro_servidor.html" class="nav-item">
            <img src="../../../../assets/imgs/modificar.png" alt="" class="menu-icon">
            Cadastrar Host
        </a>
        <a href="../../servidores/cadastro_instancia.html" class="nav-item">
            <img src="../../../../assets/imgs/modificar.png" alt="" class="menu-icon">
            Instâncias
        </a>
        <a href="../../servidores/modificar_servidor.html" class="nav-item">
            <img src="../../../../assets/imgs/modificar.png" alt="" class="menu-icon">
            Modificar
        </a>

        <h3 class="nav-categoria secao-funcionarios">
            <img src="../../../../assets/imgs/funcionarios.png" alt="" class="menu-icon-title">
            Funcionários
        </h3>
        <hr class="linha">
        <a href="gerenciar_funcionario.html" class="nav-item">
            <img src="../../../../assets/imgs/funcionarios.png" alt="" class="menu-icon">
            Gerenciar
        </a>
        <a href="../cadastro_token/cadastro_token.html" class="nav-item">
            <img src="../../../../assets/imgs/token.png" alt="" class="menu-icon">
            Cadastrar Token
        </a>
        <a href="../modificar_funcionario.html" class="nav-item">
            <img src="../../../../assets/imgs/modificar.png" alt="" class="menu-icon">
            Modificar
        </a>

        <h3 class="nav-categoria secao-empresas">
            <img src="../../../../assets/imgs/servidores.png" alt="" class="menu-icon-title">
            Empresas
        </h3>
        <hr class="linha">
        <a href="../../empresas/gerenciar_empresa.html" class="nav-item">
            <img src="../../../../assets/imgs/modificar.png" alt="" class="menu-icon">
            Gerenciar
        </a>
        <a href="../../empresas/cadastro_empresa.html" class="nav-item">
            <img src="../../../../assets/imgs/modificar.png" alt="" class="menu-icon">
            Cadastrar Empresa
        </a>

        <div class="btn-logout" onclick="limparSessao()" title="Sair do Sistema">
            <img src="../../../../assets/imgs/logout.png" alt="Sair" class="logout-icon">
        </div>
    </aside>

    <div class="container_main">
        <div class=" header">

        </div>

        <div class="main">
            <div class="subtitulo" id="subtitulo"></div>
            <div class="box-titulo">
                <div class="titulo">
                    <div class="risco"></div>FUNCIONÁRIOS
                </div>
                <div class="titulo">
                    <div class="risco"></div>GERENCIAR ACESSO
                </div>
            </div>

            <div class="container-gerenciamento">
                <div class="boxes-funcionario" id="boxes_funcionario">
                </div>

                <div class="box-crud" id="box_crud">
                    <div class="head-crud" id="head_crud">

                    </div>
                    <div class="botoes-modificar" id="botoes_modificar">
                    </div>
                    <div class="box-modificar" id="box_modificar">
                    </div>

                    <div class="footer-crud" id="footer_crud">
                    </div>
                    <div class="trecho-inicial" id="trecho_inicial">
                        <div class="texto-inicial">Seleciona um usuário <img
                                src="../../../../assets/icon/icon_user2.svg" style="width: 1.2vw;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="overlay-modal" id="modal_excluir"></div>
</body>

</html>

<script>

    var idEmpresa = sessionStorage.ID_EMPRESA;
    var idUsuario = sessionStorage.ID_USUARIO;

    head_crud.style.display = "none"
    botoes_modificar.style.display = "none"
    box_modificar.style.display = "none"
    footer_crud.style.display = "none"


    fetch(`/gerenciar_funcionario/buscarNomeEmpresa/${idEmpresa}`, { cache: 'no-store' })
        .then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {

                    subtitulo.innerHTML = `${resposta[0].razao_social} (${resposta[0].nome_fantasia})`

                })

            } else {
                console.log("Nenhum dado encontrado")
            }

        })
        .catch(function (error) {
            console.error("Erro na obtenção de dados")
        })

    function listarUsuarios(resposta) {
        boxes_funcionario.innerHTML = "";

        for (var i = 0; i < resposta.length; i++) {
            func = resposta[i];
            tipoAcesso = "";

            if (func.tipo_acesso == "GESTOR") {
                tipoAcesso = "cargo-admin";
                acesso = "GESTOR";
            } else if (func.tipo_acesso == "FUNCIONARIO") {
                tipoAcesso = "cargo-usuario";
                acesso = "COMUM";
            } else if (func.tipo_acesso == "ADMIN") {
                tipoAcesso = "cargo-infratech";
                acesso = "ADMIN";
            }

            servidores = ""
            if (func.qtdServidores == 1) {
                servidores = "1 Servidor"
            } else {
                servidores = `${func.qtdServidores} Servidores`
            }

            cor_status = "";
            if (func.status_sistema == 1) {
                cor_status = "#05DF72"
            } else {
                cor_status = "#FF0000"
            }

            iniciais = func.nome.split(" ")
                .map(n => n[0]).slice(0, 2).join("").toUpperCase();

            boxes_funcionario.innerHTML += `
        <div class="box-funcionario" id="func_${func.id_funcionario}"
             onclick="selecionarFuncionario(${func.id_funcionario})">
            <a class="container-funcionario">
                <div class="hover-funcionario">
                    <div class="circulo-iniciais">${iniciais}</div>
                    <div class="infos-escritas">
                        <div class="nome-funcionario">${func.nome}<div class = "bolinha-status" style = "background-color: ${cor_status};"></div></div>
                        <div class="cargo-servidor">
                            <div class="${tipoAcesso}">${acesso}</div>
                            <div class="servidor">${servidores} </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>`;
        }

    }

    idFuncionarioSelecionado = null
    funcionarioSelecionado = null

    function selecionarFuncionario(id) {
        idFuncionarioSelecionado = id

        var todos = document.querySelectorAll(".box-funcionario");
        for (var i = 0; i < todos.length; i++) {
            todos[i].classList.remove("selecionado");
        }

        document.getElementById(`func_${id}`).classList.add("selecionado");

        head_crud.style.display = "flex";
        botoes_modificar.style.display = "flex";
        box_modificar.style.display = "flex";
        footer_crud.style.display = "flex";
        trecho_inicial.style.display = "none";

        fetch(`/gerenciar_funcionario/buscarDadosUsuarioEspecifico/${id}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        tipoAcesso = "";
                        func = resposta[0]

                        if (func.tipo_acesso == "GESTOR") {
                            tipoAcesso = "cargo-admin";
                            acesso = "GESTOR";
                        } else if (func.tipo_acesso == "FUNCIONARIO") {
                            tipoAcesso = "cargo-usuario";
                            acesso = "COMUM";
                        } else if (func.tipo_acesso == "ADMIN") {
                            tipoAcesso = "cargo-infratech";
                            acesso = "ADMIN";
                        }

                        servidores = ""
                        if (func.qtdServidores == 1) {
                            servidores = "1 Servidor"
                        } else {
                            servidores = `${func.qtdServidores} Servidores`
                        }

                        cor_status = "";
                        status = "";
                        largura = "";
                        if (func.status_sistema == 1) {
                            cor_status = "#05DF72"
                            status = "Ativo"
                            largura = "5.5"
                        } else {
                            cor_status = "#FF0000"
                            status = "Desativado"
                            largura = "7.3"
                        }

                        iniciais = func.nome.split(" ")
                            .map(n => n[0]).slice(0, 2).join("").toUpperCase();

                        head_crud.innerHTML = `<div class="crud-identificacao">
                            <div class="circulo-iniciais-crud" style="width: 3.6vw; height: 3.6vw;">${iniciais}</div>
                            <div class="identificacao">
                                <div class="nome-funcionario" style="font-size: 1.2vw;">${func.nome}</div>
                                <div class="email-funcionario">${func.email}</div>
                            </div>
                            <div class= "container-status-sistema-crud" style = "background-color: ${cor_status}30; border: solid 1px ${cor_status}; width: ${largura}vw;">
                                <div class = "bolinha-crud" style = "background-color: ${cor_status};"></div>
                                <div class = "status-sistema-crud" style = "color: ${cor_status};">${status}</div>
                                </div>
                        </div>
                        <div class="servidor-crud-head">${servidores}</div>
                    `
                        funcionarioSelecionado = resposta
                        mostrarDadosFunc()
                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }

            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })


    }



    function mostrarDadosFunc() {
        resposta = funcionarioSelecionado
        botoes_modificar.innerHTML = `
                    <button class="botao-modificar" onclick="mostrarDadosFunc()" style="border-bottom: solid 1px #00CFFF; color: #00CFFF;">Dados</button>
                    <button class="botao-modificar" onclick="mostrarServidores(idEmpresa)">Servidores</button>`

        box_modificar.innerHTML = `
                            <div class="titulo-retorno">
                                <div class="subtitulo-box-crud"> <img src="../../../../assets/icon/icon_user2.svg"
                                        class="img-titulo">INFORMAÇÕES DO FUNCIONÁRIO</div>
                                <div class="retorno" id="retorno"></div>
                            </div>
                            <div class="container-dados">
                                <div class="box-dados" >
                                    <label class="texto-dado">Nome Completo</label> 
                                    <div class="dado-funcionario" id="nome">${resposta[0].nome}</div>
                                </div>
                                <div class="box-dados">
                                    <label class="texto-dado">Email</label>
                                    <div class="dado-funcionario" id="email">${resposta[0].email}</div>
                                </div>

                                <div class="box-dados">
                                    <label class="texto-dado">CPF</label>
                                    <div class="dado-funcionario" id="cpf">${formatarCpf(resposta[0].cpf)}</div>
                                </div>

                                <div class="box-dados">
                                    <label class="texto-dado">Data de nascimento</label>
                                    <div class="dado-funcionario" id="dtNascimento">${resposta[0].dataNascimento}</div>
                                </div>
                            </div>
                            `

        footer_crud.innerHTML = `<div class="texto-revisao"> Certifique-se de revisar as alterações antes de confirmar</div>
                            <div class = "botao-ativar-desativar" id = "botao_ativar_desativar">
                                </div>
                            <div class="box-excluir">
                                <button class="excluir" onclick="excluirUsuario()">Excluir usuário
                                    <img class="img-excluir" src="../../../../assets/icon/icon_excluir.svg">
                                    </button>
                                    </div>`

        if (func.tipo_acesso != "GESTOR") {
            if (resposta[0].status_sistema == 1) {
                botao_ativar_desativar.innerHTML = `<button onclick = "desativarUsuario()" class = "botao-desativar" id = "botao_desativar">Desativar</button>`

            } else {
                botao_ativar_desativar.innerHTML = `<button onclick = "ativarUsuario()" class = "botao-ativar" id = "botao_ativar">Ativar</button>`

            }
        }
    }

    function formatarCpf(cpf) {
        return cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
    }

    function desativarUsuario() {
        fetch(`/gerenciar_funcionario/desativarUsuario/${idFuncionarioSelecionado}`, {
            method: "PUT",
            cache: "no-store"
        })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        retorno.innerHTML = "Status atualizado com sucesso"
                        
                        setInterval(function () {
                            location.reload();
                            
                        }, 1000);

                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }
            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })
    }

    function ativarUsuario() {
        fetch(`/gerenciar_funcionario/ativarUsuario/${idFuncionarioSelecionado}`, {
            method: "PUT",
            cache: "no-store"
        })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        retorno.innerHTML = "Status atualizado com sucesso"

                        setInterval(function () {
                            location.reload();
                            
                        }, 1000);
                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }
            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })
    }


    function excluirUsuario() {
        modal_excluir.innerHTML = `
        <div class="modal-excluir">
            <h3 class="modal-titulo">Excluir usuário</h3>
            <p class="modal-texto">
                Tem certeza que deseja excluir este usuário? Essa ação não pode ser desfeita.
                </p>
                <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModalExcluir()">Cancelar</button>
                <button class="btn-confirmar" onclick="confirmarExclusao()">Excluir</button>
                </div>
                </div>`;

        modal_excluir.style.display = "flex";
    }

    function fecharModalExcluir() {
        modal_excluir.style.display = "none";
        modal_excluir.innerHTML = "";
    }

    function confirmarExclusao() {

        fetch(`/gerenciar_funcionario/deletarUsuario/${idFuncionarioSelecionado}`, {
            method: "DELETE",
            cache: "no-store"
        })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {

                        retorno.innerHTML = "Usuário deletado com sucesso"
                        head_crud.style.display = "none";
                        botoes_modificar.style.display = "none";
                        box_modificar.style.display = "none";
                        footer_crud.style.display = "none";
                        trecho_inicial.style.display = "flex";

                        idFuncionarioSelecionado = null;
                        funcionarioSelecionado = null;

                        boxes_funcionario.innerHTML = "";
                        recarregarUsuarios();
                    })

                } else {
                    console.log("Nenhum dado encontrado")
                }
            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados")
            })

        fecharModalExcluir();
    }

    function recarregarUsuarios() {
        fetch(`/gerenciar_funcionario/buscarDadosUsuario/${idEmpresa}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(listarUsuarios);
                }
            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados", error);
            });
    }

    recarregarUsuarios();

    function mostrarServidores() {

        botoes_modificar.innerHTML = `
        <button class="botao-modificar" onclick="mostrarDadosFunc()">Dados</button>
        <button class="botao-modificar" onclick="mostrarServidores()" style="border-bottom: solid 1px #00CFFF; color: #00CFFF;">Servidores</button>`;

        box_modificar.innerHTML = `
        <div class="titulo-retorno">
            <div class="subtitulo-box-crud">
                <img src="../../../../assets/icon/icon_server.svg" class="img-server">ACESSO AOS SERVIDORES
            </div>
            <div class="retorno" id="retorno"></div>
        </div>
        <div class="box-servidores" id="box_servidores"></div>`;

        footer_crud.innerHTML = `
        <div class="texto-revisao"> Certifique-se de revisar as alterações antes de confirmar</div>
        <button class="botao-salvar" onclick="alterarServidores()">Salvar alterações</button>`;

        fetch(`/gerenciar_funcionario/buscarServidoresPorEmpresa/${idEmpresa}/${idFuncionarioSelecionado}`, { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        var html = "";

                        for (var i = 0; i < resposta.length; i++) {
                            var srv = resposta[i];

                            if (srv.status_sistema == 1) {
                                cor = "#05DF72"
                            } else if (srv.status_sistema == 0) {
                                cor = "#FB2C36"
                            }

                            box_servidores.innerHTML += `
                        <div class="servidor-crud">
                            <label class="checkbox-custom">
                                <input type="checkbox" class= "checkbox" value="${srv.id_servidor}" ${srv.temAcesso ? "checked" : ""}>
                                
                            </label>
                            <div class="infos-servidor">
                                <div class="nome-servidor">${srv.nome}</div>
                                <div class="localizacao-servidor">${srv.localizacao}</div>
                            </div>
                            <div class="bola-ativo" style= "background-color: ${cor};"></div>
                        </div>`;
                        }

                    });
                } else {
                    console.log("Erro na requisição, status:", response.status);
                }
            })
            .catch(function (error) {
                console.error("Erro na obtenção de dados", error);
            });
    }


    function alterarServidores() {
        var marcados = document.querySelectorAll("#box_servidores input[type=checkbox]:checked");
        var ids = [];

        for (var i = 0; i < marcados.length; i++) {
            ids.push(Number(marcados[i].value));
        }

        fetch(`/gerenciar_funcionario/alterarServidores/${idFuncionarioSelecionado}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ servidores: ids })
        })
            .then(function (response) {
                if (response.ok) {
                    retorno.innerHTML = "Acessos atualizados com sucesso";

                    // atualiza o contador no card e no cabeçalho
                    var texto = ids.length == 1 ? "1 Servidor" : `${ids.length} Servidores`;
                    document.querySelector(`#func_${idFuncionarioSelecionado} .servidor`).innerHTML = texto;
                    document.querySelector(".servidor-crud-head").innerHTML = texto;
                } else {
                    retorno.innerHTML = "Erro ao atualizar os acessos";
                }
            })
            .catch(function (error) {
                console.error("Erro ao atualizar os acessos", error);
                retorno.innerHTML = "Erro ao atualizar os acessos";
            });
    }

</script>
