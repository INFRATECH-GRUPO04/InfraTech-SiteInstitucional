<script>

    function aplicarMascara(id, mascara) {
        const campo = document.querySelector(`#${id}`);

        campo.addEventListener("input", () => {
            campo.value = mascara(campo.value);
        });
    }

                    </li>

        container_cadastro.innerHTML = `

            if(varRazaoSocial != razaoSocial.value){
                razaoSocial =razaoSocial.value;

            if(varNomeFantasia != nomeFantasia.value){

            }
            if(razaoSocial != razaoSocial.value){
                razaoSocial =razaoSocial.value;
            }

    }

    function avancarP3() {

    }


    aplicarMascara("cnpj", valor => {

            .replace(/\.(\d{3})(\d)/, ".$1/$2")
            .replace(/(\d{4})(\d)/, "$1-$2");
    });

    aplicarMascara("telefone", valor => {
        return valor
            .replace(/\D/g, "")
            .slice(0, 11)
            .replace(/^(\d{2})(\d)/, "($1) $2")
            .replace(/(\d{5})(\d)/, "$1-$2");
    });

    function limparCnpj(cnpj) {
        return cnpj.replace(/\D/g, "");
    }

    function validarCnpj(cnpj) {
        const cnpjLimpo = limparCnpj(cnpj);
        return cnpjLimpo.length === 14;
    }

    function limparCep(cep) {
        return cep.replace(/\D/g, "");
    }

    function validarCep(cep) {
        const cepLimpo = limparCep(cep);
        return cepLimpo.length === 8;
    }

    function limparCpf(cpf) {
        return cpf.replace(/\D/g, "");
    }

    function validarCpf(cpf) {
        const cpfLimpo = limparCpf(cpf);
        return cpfLimpo.length === 11;
    }

    function limparTelefone(telefone) {
        return telefone.replace(/\D/g, "");
    }

        const telefoneLimpo = limparTelefone(telefone);
        return telefoneLimpo.length === 11;
    }

        segmentoAtuacao = segmentoAtuacao.value;

        logradouro = logradouro.value;
        numero = numero.value;
        complemento = complemento.value;
        cep = cep.value;
        bairro = bairro.value;
        estado = estado.value;
        cidade = cidade.value;



        nome = nome.value;
        dtNascimento = dtNascimento.value;
        cpf = cpf.value;
        email = email.value;
    }
